name: unzip
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git ls-files '*.zip' | while IFS= read -r f; do
            unzip -o "$f" -d "$(dirname "$f")" && git rm -q "$f"
          done
          rm -rf __MACOSX */__MACOSX
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "unzip" || echo "nothing to commit"
          git push
